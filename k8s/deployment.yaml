apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelops-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinelops-ai
  template:
    metadata:
      labels:
        app: sentinelops-ai
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: sentinelops-ai:0.2.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sentinelops-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
