name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade "setuptools>=83" pip
      - name: Install audit tool and project
        run: |
          pip install pip-audit
          pip install .
      - name: Audit installed dependencies
        run: pip-audit --skip-editable
